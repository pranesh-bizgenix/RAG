<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · BIZGENIX AI Knowledge Copilot</title>
    <link rel="icon" href="/static/img/favicon.png" type="image/png" />
    <script src="/static/js/theme.js"></script>
    <link rel="stylesheet" href="/static/css/base.css" />
    <link rel="stylesheet" href="/static/css/login.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-brand-panel">
        <div>
          <img class="logo-light" src="/static/img/bizgenix-logo.png" alt="BIZGENIX AI" width="190" height="54" />
          <img class="logo-dark" src="/static/img/bizgenix-logo-dark.png" alt="BIZGENIX AI" width="190" height="54" />
          <span class="product-label">Knowledge Copilot</span>
        </div>
        <div class="login-message"><span class="eyebrow">Secure workspace</span><h1>Your company knowledge, available to the right people.</h1><p>Sign in with your employee credentials to access the Knowledge Copilot.</p></div>
        <span class="login-security">Protected employee access</span>
      </section>
      <section class="login-form-panel">
        <div class="login-card">
          <div class="login-card-head"><h2 id="form-title">Welcome back</h2><p id="form-subtitle">Enter your email and password to continue.</p></div>
          <form id="login-form">
            <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" autocomplete="username" maxlength="254" required autofocus /></div>
            <div class="field"><label for="password">Password</label><input class="input" id="password" type="password" autocomplete="current-password" maxlength="256" required /></div>
            <p class="form-error" id="login-error" hidden></p>
            <button class="btn btn-primary login-submit" id="login-submit" type="submit">Sign in</button>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="/static/js/login.js"></script>
  </body>
</html>
